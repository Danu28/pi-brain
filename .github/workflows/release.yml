name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VER | tag: $TAG_VER"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::tag v${TAG_VER} does not match package.json version ${PKG_VER} — bump with 'npm version' first"
            exit 1
          fi

      - name: Typecheck + test + build (prepublishOnly)
        run: npm publish --dry-run

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarize
        run: echo "Published @danu28/pi-brain@${GITHUB_REF_NAME#v} → pi install npm:@danu28/pi-brain"